<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Quiz App</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h3 {
      margin-bottom: 20px;
    }

    button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    .answer {
      background: #f5f5f5;
    }

    .answer:nth-of-type(1) {
      border-left: 5px solid #3498db;
    }

    .answer:nth-of-type(2) {
      border-left: 5px solid #9b59b6;
    }

    .answer:nth-of-type(3) {
      border-left: 5px solid #e67e22;
    }

    .answer:nth-of-type(4) {
      border-left: 5px solid #2ecc71;
    }

    .correct {
      background: #2ecc71;
      color: #fff;
    }

    .wrong {
      background: #e74c3c;
      color: #fff;
    }

    #next {
      margin-top: 15px;
      background: #333;
      color: #fff;
      display: block;
    }
    #retry {
      margin-top: 15px;
      background: #333;
      color: #fff;
      display: none;
    }
    body {
    font-family: Arial, sans-serif;
}

/* الحاوية */
.toast-container {
    position: fixed;
    top: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
}

/* الشكل العام */
.toast {
    min-width: 250px;
    padding: 15px 20px;
    border-radius: 8px;
    color: white;
    font-size: 14px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    animation: slideIn 0.5s ease;
}

/* نجاح */
.toast.success {
    background-color: #28a745;
    border-left: 5px solid #1e7e34;
    display: none;
}

/* فشل */
.toast.error {
    background-color: #dc3545;
    border-left: 5px solid #a71d2a;
    display: none;
}

/* الحركة */
@keyframes slideIn {
    from {
        transform: translateX(-120%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

  </style>
</head>

<body>
  <div class="toast-container">

    <div class="toast success">
        ✔ Succes you are dragon
    </div>

    <div class="toast error">
        ✖ faild try again 
    </div>

</div>

  <div class="card">
    <h3 id="question"></h3>
    <div id="answers"></div>

    <button id="next">Next</button>
    <button id="retry">Retry</button>
  </div>

  <script>
    const questions = [
      { q: "What is 2+2?", answers: ["3", "4", "5", "6"], correct: 1 },
      {
        q: "Capital of France?",
        answers: ["Berlin", "Madrid", "Paris", "Rome"],
        correct: 2,
      },
      {
        q: "JS stands for?",
        answers: ["JavaSource", "JavaScript", "JustScript", "JScript"],
        correct: 1,
      },
      {
        q: "HTML is?",
        answers: [
          "Programming language",
          "Markup language",
          "Database",
          "OS",
        ],
        correct: 1,
      },
    ];
    let current = 0;
    let score = 0;
    const qE1 = document.getElementById("question");
    const aE1 = document.getElementById("answers");
    const nextBtn = document.getElementById("next");
    const retbtn = document.getElementById("retry");
    const succes=document.getElementsByClassName("success");
    const faild=document.getElementsByClassName("error");
    function load() {
      nextBtn.style.display = "none";
      aE1.innerHTML = "";
      const q = questions[current];
      qE1.textContent = q.q;

      q.answers.forEach((ans, i) => {
        const btn = document.createElement("button");
        btn.textContent = ans;
        btn.onclick = () => Selectans(btn, i);
        aE1.appendChild(btn);

      })
    }
    function Selectans(btn, index) {
      nextBtn.style.display = "block"
      const currectindex = questions[current].correct;
      const buttons = aE1.querySelectorAll("button");
      buttons.forEach((b, i) => {
        b.disabled = true;
        if (i == currectindex) {
          b.classList.add("correct");
         
       

        }
        else if (i == index && i !== currectindex) {
          b.classList.add("wrong");
           
        }
      })
      if (index == currectindex) {
           score++;
      }
      if (index === currectindex) {
    succes[0].style.display = "block";
} else {
    faild[0].style.display = "block";
}
    }
    nextBtn.onclick = () => {
      current++;
       faild[0].style.display="none";
       succes[0].style.display="none";
      if (current < questions.length) { load(); }
      else {
        qE1.textContent = `Your score is ${score} of 4`;
        aE1.innerHTML = "";
        nextBtn.style.display = "none";
        retbtn.style.display="block";
      }
    }
    retbtn.onclick = () => {
      if (current == questions.length) { 
         current = 0;
          score = 0;
           retbtn.style.display="none"
        load();
       }
    }
    load();
  </script>
</body>

</html>
